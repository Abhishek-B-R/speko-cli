name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs: this job holds npm publishing
      # authority through OIDC, so a hijacked action tag must not be able to
      # publish under this package's name. Same rule as tts-canary.yml.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Node 24 ships with npm 11 which supports the trusted publisher
      # OIDC exchange. Keep this workflow filename and package repository URL
      # in sync with the trusted publisher settings on npmjs.com.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify package version matches tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$PACKAGE_VERSION" != "$VERSION" ]; then
            echo "::error::package.json version ${PACKAGE_VERSION} does not match tag v${VERSION}"
            exit 1
          fi

      - run: npm install --no-save

      - name: Build for publish
        run: npx tsc -p tsconfig.publish.json

      - name: Publish with trusted publishing
        run: npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "v${VERSION}" \
            --generate-notes \
            --verify-tag
